name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install sherpa-onnx numpy soundfile pytest
      - name: Compile Python
        run: python -m compileall -q scripts/translation scripts/realtime_transcribe.py scripts/subtitle_server.py docker/entrypoint.py
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Validate Docker Compose
        if: runner.os == 'Linux'
        run: docker compose config --quiet
